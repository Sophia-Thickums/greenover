[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "falsegreen"
version = "0.1.0"
description = "Chaos engineering for AI pipelines: does your monitoring actually monitor?"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Sophia Marie DeClue"}]
keywords = ["ai", "observability", "monitoring", "rocm", "amd", "chaos-engineering", "silent-failure"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.scripts]
falsegreen = "falsegreen.falsegreen:main"

[project.urls]
Homepage = "https://github.com/Sophia-Thickums/falsegreen"

[tool.setuptools]
packages = ["falsegreen"]
